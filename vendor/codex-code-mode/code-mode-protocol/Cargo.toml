# Modified for the standalone AJ extraction: decouple protocol dependencies.
[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-protocol"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode_protocol"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
grpc = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:glob", "dep:protoc-bin-vendored", "dep:tonic-prost-build"]

[dependencies]
prost = { version = "0.14.3", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

[build-dependencies]
glob = { workspace = true, optional = true }
protoc-bin-vendored = { version = "3.2.0", optional = true }
tonic-prost-build = { version = "=0.14.3", default-features = false, features = ["transport"], optional = true }

# Cargo-shear cannot inspect the prost and tonic-prost references in generated gRPC bindings.
[package.metadata.cargo-shear]
ignored = ["prost", "tonic-prost"]

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
