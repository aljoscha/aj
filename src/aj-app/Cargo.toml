[package]
name = "aj-app"
version.workspace = true
edition.workspace = true

[dependencies]
aj-agent = { path = "../aj-agent/" }
aj-conf = { path = "../aj-conf/" }
aj-models = { path = "../aj-models/" }
aj-session = { path = "../aj-session/" }
aj-tools = { path = "../aj-tools/" }
aj-wire = { path = "../aj-wire/" }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true }
notify = { workspace = true }
pulldown-cmark = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syntect = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
# The moved print-mode tests use `#[tokio::test(start_paused = true)]`,
# which needs tokio's `test-util` feature (not part of `full`), so the
# crate is testable in isolation and not only via workspace feature
# unification.
tokio = { workspace = true, features = ["test-util"] }
# Integration tests under `tests/` link the crate as an external
# dependency, so they see `test_support` only if the feature is enabled
# for that link. Without this the module is reachable only under
# `cargo test --workspace`, where `aj`'s dev-dependency happens to turn
# the feature on and the resolver unifies it.
aj-app = { path = ".", features = ["test-support"] }
# `replay_sse_events` drives a provider adapter's real stream state from
# a list of SSE frames. The cost tests use it so their fixtures are
# messages an adapter produced rather than messages a test hand-built,
# which is the difference between pinning the pricing and restating it.
aj-models = { path = "../aj-models/", features = ["test-support"] }
# The SSE frame types the replayed fixtures are written in.
anthropic-sdk = { path = "../anthropic-sdk" }

[features]
# Exposes the `test_support` module (scripted-provider / run-config
# builders and a headless agent builder) to downstream crates' tests.
# Kept behind a feature rather than `#[cfg(test)]` because a crate's
# `cfg(test)` items are invisible to other crates.
test-support = []

[lints]
workspace = true
