[package]
name = "aj-agent"
version.workspace = true
edition.workspace = true

[features]
# Exposes synthetic task-entry construction to tests in downstream crates.
# Production task creation always carries a tracked driver registration.
test-support = []

[dependencies]
aj-models = { path = "../aj-models" }
codex-code-mode-protocol = { path = "../../vendor/codex-code-mode/code-mode-protocol" }
codex-code-mode-runtime = { path = "../../vendor/codex-code-mode/code-mode-runtime" }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
rand = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-retry2 = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
