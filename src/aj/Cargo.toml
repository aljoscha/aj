[package]
name = "aj"
version.workspace = true
edition.workspace = true

[[bin]]
name = "aj"
path = "src/main.rs"

[dependencies]
aj-agent = { path = "../aj-agent/" }
aj-app = { path = "../aj-app/" }
aj-conf = { path = "../aj-conf/" }
aj-models = { path = "../aj-models/" }
aj-session = { path = "../aj-session/" }
aj-tools = { path = "../aj-tools/" }
aj-wire = { path = "../aj-wire/" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dotenv = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
ignore = { workspace = true }
nucleo = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
vaxis = { path = "../vaxis/" }

[dev-dependencies]
aj-agent = { path = "../aj-agent/", features = ["test-support"] }
aj-app = { path = "../aj-app/", features = ["test-support"] }
aj-models = { path = "../aj-models/", features = ["test-support"] }
nix = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
