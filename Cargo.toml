[workspace]
members = [
    "evals/apply-patch-description",
    "src/aj",
    "src/aj-agent",
    "src/aj-app",
    "src/aj-conf",
    "src/aj-models",
    "src/aj-session",
    "src/aj-tools",
    "src/aj-wire",
    "src/anthropic-sdk",
    "src/openai-sdk",
    "src/vaxis",
    "src/vaxis-ucd",
    "src/vaxis-derive",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
arboard = { version = "3", default-features = false, features = ["image-data"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
compact_str = "0.10"
dotenv = "0.15.0"
eventsource-stream = "0.2"
flate2 = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http = "1"
iana-time-zone = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
nix = { version = "0.31", features = ["signal", "term", "fs", "ioctl"] }
notify = "8.2"
phf = { version = "0.14", features = ["macros"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["derive"] }
nucleo = "0.5"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.10"
regex = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "stream", "rustls", "charset", "http2", "system-proxy"] }
schemars = { version = "1.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
serial_test = "3"
sha2 = "0.11"
signal-hook = "0.4"
similar = "3.1"
strsim = "0.11"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-retry2 = { version = "0.9", features = ["jitter"] }
tokio-util = { version = "0.7", default-features = false }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["env-filter", "fmt", "ansi"] }
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.25"
unicode-width = "0.2"
url = "2"

[workspace.lints.rust]
unknown_lints = "warn"
non_local_definitions = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bazel, stamped, coverage, nightly_doc_features, release, tokio_unstable)'] }

[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
large_enum_variant = { level = "allow", priority = 0 }
result_large_err = { level = "allow", priority = 0 }
mutable_key_type = { level = "allow", priority = 0 }
stable_sort_primitive = { level = "allow", priority = 0 }
map_entry = { level = "allow", priority = 0 }
box_default = { level = "allow", priority = 0 }
drain_collect = { level = "allow", priority = 0 }
bool_comparison = "warn"
clone_on_ref_ptr = "warn"
no_effect = "warn"
unnecessary_unwrap = "warn"
dbg_macro = "warn"
todo = "warn"
zero_prefixed_literal = "warn"
borrowed_box = "warn"
deref_addrof = "warn"
double_must_use = "warn"
double_parens = "warn"
extra_unused_lifetimes = "warn"
needless_borrow = "warn"
needless_question_mark = "warn"
needless_return = "warn"
redundant_pattern = "warn"
redundant_slicing = "warn"
redundant_static_lifetimes = "warn"
single_component_path_imports = "warn"
unnecessary_cast = "warn"
useless_asref = "warn"
useless_conversion = "warn"
builtin_type_shadow = "warn"
duplicate_underscore_argument = "warn"
unnecessary_mut_passed = "warn"
wildcard_in_or_patterns = "warn"
crosspointer_transmute = "warn"
excessive_precision = "warn"
panicking_overflow_checks = "warn"
as_conversions = "warn"
match_overlapping_arm = "warn"
zero_divided_by_zero = "warn"
must_use_unit = "warn"
suspicious_assignment_formatting = "warn"
suspicious_else_formatting = "warn"
suspicious_unary_op_formatting = "warn"
mut_mutex_lock = "warn"
print_literal = "warn"
same_item_push = "warn"
useless_format = "warn"
write_literal = "warn"
redundant_closure = "warn"
redundant_closure_call = "warn"
unnecessary_lazy_evaluations = "warn"
partialeq_ne_impl = "warn"
redundant_field_names = "warn"
transmutes_expressible_as_ptr_casts = "warn"
unused_async = "warn"
disallowed_methods = "warn"
disallowed_macros = "warn"
disallowed_types = "warn"
from_over_into = "warn"
mod_module_files = "warn"
needless_pass_by_ref_mut = "warn"
borrow_interior_mutable_const = "warn"
or_fun_call = "warn"

[profile.dev]
# Debug builds are the ones agents and humans iterate on, and full debuginfo is
# the single biggest contributor to target dir size. Line tables keep file and
# line in backtraces, which is what we actually read. For a debugger session
# that needs variable inspection, override per build with
# CARGO_PROFILE_DEV_DEBUG=2.
debug = "line-tables-only"
